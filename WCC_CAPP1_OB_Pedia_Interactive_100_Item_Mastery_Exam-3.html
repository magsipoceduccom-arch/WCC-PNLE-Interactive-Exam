<meta charset="utf-8">

<title>WCC CAPP-1 OB & Pedia 100-Item Interactive Mastery Exam</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6fa;color:#182230;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:760px;margin:auto;padding:14px}
.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
h1{font-size:21px;margin:0 0 5px}.sub{font-size:13px;color:#667085;margin-bottom:14px}
.meta{display:flex;justify-content:space-between;font-weight:800;font-size:14px;color:#475467}
.barbg{height:8px;background:#e8ebf0;border-radius:99px;margin:10px 0 18px;overflow:hidden}
.bar{height:100%;background:#4f46e5;transition:.2s}
.q{font-size:18px;font-weight:750;line-height:1.45;margin-bottom:16px}
.choice{display:block;width:100%;text-align:left;background:#fff;border:2px solid #d8dee8;border-radius:13px;padding:13px;margin:9px 0;font-size:15.5px;line-height:1.35;cursor:pointer}
.choice.correct{border-color:#16a34a;background:#ecfdf3}
.choice.wrong{border-color:#dc2626;background:#fef2f2}
.choice:disabled{cursor:default}
.feedback{display:none;margin-top:14px;padding:14px;border-radius:13px;line-height:1.45}
.ok{display:block;background:#ecfdf3;color:#166534}.no{display:block;background:#fef2f2;color:#991b1b}
.next,.restart{width:100%;border:0;border-radius:13px;padding:14px;margin-top:14px;background:#111827;color:#fff;font-weight:850;font-size:16px;cursor:pointer;display:none}
.result{text-align:center}.score{font-size:46px;font-weight:950}
.small{font-size:12px;color:#667085;margin-top:15px}
</style>

<script>
const questions = [{"q": "A client at 39 weeks reports contractions that become stronger and continue despite walking. Which finding BEST confirms that the client is experiencing true labor?", "choices": ["The client experiences contractions without any cervical change.", "The contractions are accompanied by progressive cervical dilation and effacement.", "The contractions become less painful while walking.", "The client reports intermittent abdominal discomfort."], "answer": 1, "rationale": "The study guide identifies progressive cervical dilation and effacement over time as the definitive sign of true labor. False labor typically lessens or stops with walking and does not cause cervical change."}, {"q": "A postpartum nurse assesses a client 24 hours after birth. Which fundal finding is EXPECTED?", "choices": ["Firm fundus displaced laterally from midline", "Boggy, displaced fundus above the umbilicus", "Soft fundus 2 cm above the umbilicus", "Firm, midline fundus 1 cm below the umbilicus"], "answer": 3, "rationale": "At 24 hours postpartum, the study guide states that the fundus should be firm, midline, and 1 cm below the umbilicus."}, {"q": "A laboring client develops a fetal heart rate pattern consisting of abrupt drops with varying shapes. What is the nurse's INITIAL intervention according to the study guide?", "choices": ["Continue the oxytocin infusion and observe.", "Immediately prepare for cesarean delivery.", "Reposition the mother.", "Perform a digital cervical examination."], "answer": 2, "rationale": "Variable decelerations are caused by umbilical cord compression. The study guide identifies maternal repositioning as the initial intervention."}, {"q": "A client receiving magnesium sulfate develops respiratory depression, absent deep tendon reflexes, and oliguria. What is the PRIORITY nursing action?", "choices": ["Increase the magnesium sulfate infusion.", "Administer oxytocin immediately.", "Encourage ambulation to increase urine output.", "Stop the magnesium sulfate infusion immediately."], "answer": 3, "rationale": "These are cardinal signs of magnesium toxicity. The study guide directs the nurse to stop the infusion immediately and have calcium gluconate available as the antidote."}, {"q": "A pregnant client presents with painless, bright-red vaginal bleeding. Which action is CONTRAINDICATED?", "choices": ["Monitor the bleeding.", "Perform a digital cervical examination.", "Prepare for appropriate management.", "Assess the client's condition."], "answer": 1, "rationale": "The study guide describes placenta previa as painless, bright-red bleeding and states that digital cervical examinations are strictly contraindicated because they can cause catastrophic hemorrhage."}, {"q": "A postpartum client has a boggy uterus and heavy bleeding. Which intervention should the nurse perform FIRST?", "choices": ["Apply continuous aggressive fundal massage.", "Encourage the client to ambulate.", "Place the client in a prone position.", "Administer methylergonovine regardless of blood pressure."], "answer": 0, "rationale": "The study guide identifies uterine atony ('Tone') as a major cause of postpartum hemorrhage and directs the nurse to perform continuous aggressive fundal massage first."}, {"q": "A client with postpartum hemorrhage has elevated blood pressure. Which medication should the nurse recognize as CONTRAINDICATED?", "choices": ["Oxytocin", "Methylergonovine", "Calcium gluconate", "Magnesium sulfate"], "answer": 1, "rationale": "The study guide states that methylergonovine is strictly contraindicated in clients with elevated blood pressure or preeclampsia."}, {"q": "A laboring client suddenly reports sharp, tearing pain followed by cessation of contractions and fetal bradycardia. Which emergency should the nurse SUSPECT?", "choices": ["Mastitis", "False labor", "Uterine rupture", "Placenta previa"], "answer": 2, "rationale": "The study guide identifies sharp, tearing pain, sudden cessation of contractions, and sudden fetal bradycardia as findings suggesting uterine rupture."}, {"q": "A newborn develops a complication in which breastfeeding stimulation is expected to have a protective effect against postpartum hemorrhage. Which mechanism explains this effect?", "choices": ["Nipple stimulation suppresses oxytocin and relaxes the uterus.", "Nipple stimulation directly increases cervical dilation.", "Breastfeeding prevents all forms of postpartum bleeding.", "Nipple stimulation releases oxytocin, causing uterine smooth muscle contraction."], "answer": 3, "rationale": "The study guide states that nipple stimulation triggers oxytocin release, promoting milk ejection and uterine smooth muscle contractions that help prevent hemorrhage."}, {"q": "A postpartum client has unilateral breast redness, warmth, exquisite tenderness, and fever. Which instruction is MOST appropriate based on the study guide?", "choices": ["Stop breastfeeding on the affected side permanently.", "Apply a strict restriction on milk removal.", "Continue breastfeeding or pumping frequently on the affected side.", "Avoid emptying the affected breast."], "answer": 2, "rationale": "These findings are consistent with mastitis. The study guide states that the client should continue breastfeeding or pump frequently on the affected side to clear milk stasis."}, {"q": "A child with Tetralogy of Fallot develops a hypercyanotic episode after crying. Which position should the nurse place the child in IMMEDIATELY?", "choices": ["Supine with legs extended", "Side-lying with the legs elevated", "Prone with the head flat", "Squatting or knee-chest position"], "answer": 3, "rationale": "The study guide states that TET spells may be triggered by crying and that squatting or knee-chest positioning increases systemic vascular resistance and forces blood into the pulmonary artery for oxygenation."}, {"q": "A newborn with a cleft lip and palate is being assessed before surgery. Which complication is the GREATEST feeding-related risk identified in the study guide?", "choices": ["Hyperthermia", "Constipation", "Aspiration", "Hypertension"], "answer": 2, "rationale": "The study guide states that infants with cleft lip/palate cannot form a proper vacuum, making aspiration the greatest risk during feeding."}, {"q": "An infant has a neural tube defect with a sac protruding from the back. Which nursing action has the HIGHEST priority?", "choices": ["Place the infant supine to inspect the sac.", "Allow the sac to dry before covering it.", "Place the infant in a strict prone position and protect the sac.", "Massage the sac gently to improve circulation."], "answer": 2, "rationale": "The study guide identifies strict prone positioning as the absolute priority to eliminate pressure on the sac. The sac should be covered with a sterile, saline-moistened, non-adherent dressing."}, {"q": "A child with spina bifida is admitted for care. Which environmental precaution is MOST important according to the study guide?", "choices": ["Remove all latex products from the environment.", "Keep the child in a dark room.", "Avoid all cotton products.", "Restrict all visitors for 24 hours."], "answer": 0, "rationale": "The study guide states that children with spina bifida have a disproportionately high risk of severe latex allergies, requiring removal of all latex products from the environment."}, {"q": "A child suddenly develops high fever, excessive drooling, dysphagia, and tripod positioning. Which nursing action is PRIORITY?", "choices": ["Insert a tongue depressor to visualize the airway.", "Encourage the child to lie flat.", "Inspect the throat with an object.", "Secure the airway while avoiding anything in the mouth."], "answer": 3, "rationale": "These findings indicate epiglottitis. The study guide identifies airway security as the absolute priority and states that inserting anything into the mouth is strictly contraindicated because it can cause sudden airway occlusion."}, {"q": "An infant has constant hunger, non-bilious projectile vomiting, and a palpable olive-shaped mass in the right upper quadrant. Which condition is MOST consistent with these findings?", "choices": ["Intussusception", "Meningitis", "Hirschsprung's disease", "Pyloric stenosis"], "answer": 3, "rationale": "The study guide describes pyloric stenosis as hypertrophy of the pyloric sphincter with constant hunger, non-bilious projectile vomiting, and a palpable olive-shaped mass in the right upper quadrant."}, {"q": "A child presents with severe, colicky abdominal pain and bloody, mucus-filled 'currant jelly' stool. Which condition should the nurse recognize?", "choices": ["Intussusception", "Pyloric stenosis", "Hirschsprung's disease", "Croup"], "answer": 0, "rationale": "The study guide identifies intussusception as telescoping of the bowel into itself, with severe colicky abdominal pain and currant jelly stool as cardinal signs."}, {"q": "A child with suspected meningitis is admitted. Which isolation precaution should the nurse implement IMMEDIATELY?", "choices": ["Contact isolation only", "Droplet isolation for at least the first 24 hours of antibiotic therapy", "No isolation is necessary", "Airborne isolation for the entire admission"], "answer": 1, "rationale": "The study guide states that bacterial meningitis presents with nuchal rigidity, photophobia, severe headache, and high fever, and that droplet isolation should be implemented immediately for at least the first 24 hours of antibiotic therapy."}, {"q": "A child is experiencing a tonic-clonic seizure. Which nursing action is MOST appropriate during the convulsion?", "choices": ["Force the child into a sitting position.", "Place an object in the mouth to prevent tongue injury.", "Restrain the child's arms and legs.", "Clear hazards and protect the child's head without restraining the child."], "answer": 3, "rationale": "The study guide directs the nurse to clear hazards and protect the head without restraining the patient or placing anything in the mouth. Blow-by oxygen may be provided during the convulsion."}, {"q": "A child is being treated for Kawasaki disease. Which therapy is specifically identified in the study guide as an important treatment despite the usual concern about aspirin use in children?", "choices": ["High-dose aspirin with high-dose intravenous immunoglobulin", "Aspirin avoidance with no IV therapy", "Methylergonovine with IV fluids", "Magnesium sulfate with oxytocin"], "answer": 0, "rationale": "The study guide states that Kawasaki disease is treated with high-dose IV immunoglobulin and high-dose aspirin to prevent fatal coronary artery aneurysms, making it a major exception to the usual rule of avoiding aspirin in children."}, {"q": "Source-based mastery variation: A client at 39 weeks reports contractions that become stronger and continue despite walking. Which finding BEST confirms that the client is experiencing true labor?", "choices": ["The client reports intermittent abdominal discomfort.", "The contractions are accompanied by progressive cervical dilation and effacement.", "The client experiences contractions without any cervical change.", "The contractions become less painful while walking."], "answer": 1, "rationale": "The study guide identifies progressive cervical dilation and effacement over time as the definitive sign of true labor. False labor typically lessens or stops with walking and does not cause cervical change."}, {"q": "Source-based mastery variation: A postpartum nurse assesses a client 24 hours after birth. Which fundal finding is EXPECTED?", "choices": ["Firm fundus displaced laterally from midline", "Soft fundus 2 cm above the umbilicus", "Firm, midline fundus 1 cm below the umbilicus", "Boggy, displaced fundus above the umbilicus"], "answer": 2, "rationale": "At 24 hours postpartum, the study guide states that the fundus should be firm, midline, and 1 cm below the umbilicus."}, {"q": "Source-based mastery variation: A laboring client develops a fetal heart rate pat let i=0, score=0, answered=false;

function render(){
  answered=false;
  const x=questions[i], pct=((i+1)/questions.length)*100;
  document.getElementById('app').innerHTML =
    '<h1>WCC CAPP-1 OB & Pedia Mastery Exam</h1>'+
    '<div class="sub">100 items • Hard PNLE-style • Source-limited</div>'+
    '<div class="meta"><span>Question '+(i+1)+' of 100</span><span>Score: '+score+'</span></div>'+
    '<div class="barbg"><div class="bar" style="width:'+pct+'%"></div></div>'+
    '<div class="q">'+x.q+'</div><div id="choices"></div>'+
    '<div id="fb" class="feedback"></div>'+
    '<button id="next" class="next">'+(i===99?'View Final Score':'Next Question →')+'</button>'+
    '<div class="small">Tap one answer. Feedback appears only after selection.</div>';

  const box=document.getElementById('choices');
  x.choices.forEach((c,j)=>{
    const b=document.createElement('button');
    b.className='choice';
    b.innerHTML='<b>'+String.fromCharCode(65+j)+'.</b> '+c;
    b.onclick=()=>answer(j);
    box.appendChild(b);
  });
  document.getElementById('next').onclick=()=>{if(i<99){i++;render()}else{result()}};
}

function answer(j){
  if(answered)return;
  answered=true;
  const x=questions[i], bs=[...document.querySelectorAll('.choice')];
  bs.forEach((b,k)=>{b.disabled=true;if(k===x.answer)b.classList.add('correct')});
  const fb=document.getElementById('fb');
  if(j===x.answer){
    score++;
    fb.className='feedback ok';
    fb.innerHTML='<b>✓ CORRECT</b><br>'+x.rationale;
  }else{
    bs[j].classList.add('wrong');
    fb.className='feedback no';
    fb.innerHTML='<b>✗ INCORRECT</b><br><b>Correct answer: '+String.fromCharCode(65+x.answer)+'.</b> '+x.rationale;
  }
  document.querySelector('.meta span:last-child').textContent='Score: '+score;
  document.getElementById('next').style.display='block';
}

function result(){
  document.getElementById('app').innerHTML =
    '<div class="result"><h1>100-Item Mastery Exam Complete 🎉</h1>'+
    '<div class="score">'+score+'/100</div><h2>'+score+'%</h2>'+

}
